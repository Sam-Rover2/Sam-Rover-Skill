<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Согласование сцены</title>
<style>
  :root { --bg:#f4f1ec; --fg:#1b1b1f; --muted:#6b6660; --card:#fff; --line:#e4ded4; --accent:#e0573f; --ok:#2e9d5b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { --bg:#16171b; --fg:#ecebe8; --muted:#a19c95; --card:#20222a; --line:#30323b; } }
  :root[data-theme=dark] { --bg:#16171b; --fg:#ecebe8; --muted:#a19c95; --card:#20222a; --line:#30323b; }
  * { box-sizing: border-box; }
  html, body, #root { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  .app { display:grid; grid-template-columns: 300px 1fr; height:100%; }
  aside { overflow:auto; border-right:1px solid var(--line); padding:16px; }
  aside h1 { font-size:20px; margin:0; } .muted { color:var(--muted); margin:2px 0 12px; }
  aside h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:16px 0 6px; }
  .item { display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:10px; padding:8px 10px; margin:4px 0; cursor:pointer; font:inherit; }
  .item span:first-child { flex:1; } .item.on { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
  .badge { font-weight:700; } .badge.approved { color:var(--ok); } .badge.draft { color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .copy { width:100%; margin-top:16px; padding:10px; border-radius:10px; border:0; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .clear { width:100%; margin-top:8px; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
  .clear:hover { border-color:var(--accent); color:var(--accent); }
  main { position:relative; overflow:hidden; }
  main canvas { display:block; }
  .bar { position:absolute; top:12px; left:12px; right:12px; display:flex; flex-wrap:wrap; gap:6px; }
  .bar button { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:999px; padding:6px 12px; cursor:pointer; font:inherit; }
  .bar button.on { background:var(--fg); color:var(--bg); }
  .frame { position:absolute; top:50%; left:50%; height:100%; transform:translate(-50%,-50%); outline:3px solid #fff; box-shadow:0 0 0 9999px rgba(0,0,0,.45); pointer-events:none; border-radius:4px; }
  .help { position:absolute; left:12px; bottom:132px; background:color-mix(in srgb, var(--card) 88%, transparent); border:1px solid var(--line); border-radius:10px; padding:6px 10px; color:var(--muted); }
  .notes { position:absolute; left:12px; right:12px; bottom:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 10px; }
  .notes label { font-size:12px; color:var(--muted); } .notes textarea { width:100%; height:64px; border:0; resize:none; background:transparent; color:var(--fg); font:inherit; outline:none; }
  .fallback { max-width:640px; margin:10vh auto; padding:24px; background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .fallback h1 { margin:0 0 8px; font-size:22px; } .err { color:var(--accent); font-weight:600; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: 40% 60%; } aside { border-right:0; border-bottom:1px solid var(--line); } .help { display:none; } }
</style>
</head>
<body>
<div id="root">
  <div class="fallback">
    <h1>Файл согласования</h1>
    <p>Если вы видите этот текст, 3D-просмотр не запустился.</p>
    <p><b>Как открыть:</b> скачайте файл на компьютер и откройте его двойным кликом в <b>Chrome</b>, <b>Edge</b> или <b>Safari</b>.<br>Встроенный просмотр в приложениях и мессенджерах обычно не запускает такие файлы.</p>
    <p id="errbox" class="err"></p>
  </div>
</div>
<script>
  window.addEventListener('error', function (e) { var b = document.getElementById('errbox'); if (b) b.textContent = 'Ошибка: ' + (e.message || e); });
  (function () { try { var c = document.createElement('canvas'); if (!(c.getContext('webgl2') || c.getContext('webgl'))) { var b = document.getElementById('errbox'); if (b) b.textContent = 'Этот браузер не поддерживает 3D (WebGL). Откройте файл в свежем Chrome или Edge.'; window.__noWebGL = true; } } catch (e) {} })();
</script>
<script>/*BUNDLE*/</script>
</body>
</html>
