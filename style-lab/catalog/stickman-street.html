<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------- basics ---------- */
const INK = 0x0b0b0b, PAPER = 0xe7e7e4, WHITE = 0xfbfbf8, GREY = 0xd8d8d4;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
scene.fog = new THREE.Fog(PAPER, 70, 170);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 4;
controls.maxDistance = 120;

scene.add(new THREE.HemisphereLight(0xffffff, 0xbdbdb8, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(-20, 40, 25);
scene.add(sun);

let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

/* ---------- materials ---------- */
const paperMat = new THREE.MeshLambertMaterial({ color: WHITE });
const greyMat = new THREE.MeshLambertMaterial({ color: GREY });
const inkMat = new THREE.MeshBasicMaterial({ color: INK });
const lineMats = [];
const lineMat = (px) => {
  const m = new LineMaterial({ color: INK, linewidth: px, worldUnits: false });
  m.resolution.set(innerWidth, innerHeight);
  lineMats.push(m);
  return m;
};
const EDGE = lineMat(2.6), EDGE_THIN = lineMat(1.6);

/* hand-drawn edges: every edge is split in 3 and jittered a little */
function inkEdges(geo, mat = EDGE, jitter = 0.035, threshold = 25) {
  const eg = new THREE.EdgesGeometry(geo, threshold);
  const p = eg.getAttribute('position');
  const out = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  for (let i = 0; i < p.count; i += 2) {
    a.fromBufferAttribute(p, i); b.fromBufferAttribute(p, i + 1);
    const len = a.distanceTo(b);
    const n = Math.max(1, Math.round(len / 2.5));
    let prev = a.clone();
    for (let k = 1; k <= n; k++) {
      const q = a.clone().lerp(b, k / n);
      if (k < n) q.add(new THREE.Vector3((rnd() - 0.5) * jitter, (rnd() - 0.5) * jitter, (rnd() - 0.5) * jitter).multiplyScalar(Math.min(4, len)));
      out.push(prev.x, prev.y, prev.z, q.x, q.y, q.z);
      prev = q;
    }
    // overshoot at the ends like a quick pen stroke
    const d = b.clone().sub(a).normalize().multiplyScalar(Math.min(0.25, len * 0.06));
    out.push(b.x, b.y, b.z, b.x + d.x, b.y + d.y, b.z + d.z);
  }
  const g = new LineSegmentsGeometry();
  g.setPositions(out);
  return new LineSegments2(g, mat);
}

/** paper box with ink edges */
function inkBox(w, h, d, x, y, z, mat = paperMat, edge = EDGE) {
  const g = new THREE.BoxGeometry(w, h, d);
  const grp = new THREE.Group();
  const m = new THREE.Mesh(g, mat);
  grp.add(m, inkEdges(g, edge));
  grp.position.set(x, y, z);
  return grp;
}
const solid = (geo, x, y, z, mat = inkMat) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };

/** ink stroke as a 3D tube that tapers and frays at the end */
function inkTube(points, r = 0.12, taper = [0.1, 0.35]) {
  const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)));
  const segs = 40, rad = 8;
  const pos = [], idx = [];
  const frames = curve.computeFrenetFrames(segs, false);
  for (let i = 0; i <= segs; i++) {
    const u = i / segs;
    const c = curve.getPointAt(u);
    let rr = r * (0.9 + rnd() * 0.2);
    if (u < taper[0]) rr *= 0.35 + 0.65 * (u / taper[0]);
    if (u > 1 - taper[1]) rr *= Math.max(0.05, (1 - u) / taper[1]);
    for (let j = 0; j < rad; j++) {
      const a = (j / rad) * Math.PI * 2;
      const v = c.clone().addScaledVector(frames.normals[i], Math.cos(a) * rr).addScaledVector(frames.binormals[i], Math.sin(a) * rr);
      pos.push(v.x, v.y, v.z);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < rad; j++) {
    const a = i * rad + j, b = i * rad + ((j + 1) % rad), c = a + rad, d = b + rad;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g, inkMat);
}

/* ---------- ground & street ---------- */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0xf1f1ee }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(400, 12), new THREE.MeshLambertMaterial({ color: 0xdadad6 }));
road.rotation.x = -Math.PI / 2; road.position.y = 0.01;
scene.add(road);
for (const z of [-6.2, 6.2]) scene.add(inkTube([[-160, 0.18, z], [0, 0.2, z + 0.05], [160, 0.18, z]], 0.13, [0.01, 0.01]));
for (const z of [-6, 6]) scene.add(inkBox(320, 0.35, 0.4, 0, 0.17, z, paperMat, EDGE_THIN));
for (let x = -150; x < 150; x += 6) {
  const d = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 0.3), inkMat);
  d.rotation.x = -Math.PI / 2; d.position.set(x, 0.02, 0); scene.add(d);
}
for (let i = 0; i < 7; i++) {   // crosswalk
  const s = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 9.5), inkMat);
  s.rotation.x = -Math.PI / 2; s.position.set(-30 + i * 1.6, 0.02, 0); scene.add(s);
}

/* ---------- houses ---------- */
function house({ x, z, w, d = 10, floors = 3, roof = 'flat', side }) {
  const g = new THREE.Group();
  const fh = 6.6, h = floors * fh;
  g.add(inkBox(w, h, d, 0, h / 2, 0));
  const front = side > 0 ? d / 2 : -d / 2; // façade toward the street (z = 0)
  const fz = front + Math.sign(front) * 0.06;
  // windows
  const cols = Math.max(2, Math.floor(w / 5));
  for (let f = 1; f < floors; f++) for (let c = 0; c < cols; c++) {
    const wx = (c - (cols - 1) / 2) * (w / cols);
    const wy = f * fh + fh * 0.5;
    const win = inkBox(2.6, 3.4, 0.15, wx, wy, fz);
    g.add(win);
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 3.1), (f + c) % 3 ? inkMat : greyMat);
    glass.position.set(wx, wy, fz + Math.sign(front) * 0.09);
    if (front < 0) glass.rotation.y = Math.PI;
    g.add(glass);
    g.add(inkBox(0.18, 3.1, 0.2, wx, wy, fz + Math.sign(front) * 0.1, paperMat, EDGE_THIN));
    g.add(inkBox(3.2, 0.25, 0.7, wx, wy - 1.85, fz + Math.sign(front) * 0.3, paperMat, EDGE_THIN));
  }
  // storey lines
  for (let f = 1; f < floors; f++) g.add(inkBox(w + 0.3, 0.3, 0.4, 0, f * fh, fz, paperMat, EDGE_THIN));
  // ground floor: door + shop window + striped awning
  const door = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 4.8), inkMat);
  door.position.set(-w / 4, 2.4, fz + Math.sign(front) * 0.05); if (front < 0) door.rotation.y = Math.PI;
  g.add(door, inkBox(2.8, 0.3, 0.4, -w / 4, 5.0, fz, paperMat, EDGE_THIN));
  g.add(inkBox(w / 2.6, 3.2, 0.2, w / 6, 2.8, fz));
  const shop = new THREE.Mesh(new THREE.PlaneGeometry(w / 2.6 - 0.4, 2.8), greyMat);
  shop.position.set(w / 6, 2.8, fz + Math.sign(front) * 0.12); if (front < 0) shop.rotation.y = Math.PI;
  g.add(shop);
  if (rnd() > 0.35) {
    const aw = new THREE.Group();
    const n = 9, aww = w * 0.7;
    for (let i = 0; i < n; i++) {
      const strip = new THREE.Mesh(new THREE.BoxGeometry(aww / n, 0.12, 2.2), i % 2 ? inkMat : paperMat);
      strip.position.set(-aww / 2 + (i + 0.5) * (aww / n), 0, 0);
      aw.add(strip);
    }
    aw.add(inkEdges(new THREE.BoxGeometry(aww, 0.12, 2.2), EDGE_THIN));
    aw.position.set(w / 10, 5.6, fz + Math.sign(front) * 1.0);
    aw.rotation.x = Math.sign(front) * 0.4;
    g.add(aw);
  }
  // roof
  if (roof === 'gable') {
    const shape = new THREE.Shape([new THREE.Vector2(-w / 2 - 0.6, 0), new THREE.Vector2(w / 2 + 0.6, 0), new THREE.Vector2(0, w * 0.32)]);
    const rg = new THREE.ExtrudeGeometry(shape, { depth: d + 1, bevelEnabled: false });
    rg.translate(0, h, -d / 2 - 0.5);
    g.add(new THREE.Mesh(rg, greyMat), inkEdges(rg));
    g.add(inkBox(1.2, 4, 1.2, w * 0.25, h + w * 0.18, 0));
  } else {
    g.add(inkBox(w + 0.6, 0.8, d + 0.6, 0, h + 0.4, 0));
    if (rnd() > 0.4) { // water tank
      const t = new THREE.CylinderGeometry(1.6, 1.6, 3, 10);
      g.add(solid(t, w * 0.2, h + 3.6, 0, paperMat)); g.children.at(-1).add(inkEdges(t, EDGE_THIN, 0.02, 40));
      for (const sx of [-1, 1]) g.add(inkTube([[w * 0.2 + sx * 1.1, h + 0.8, 0], [w * 0.2 + sx * 1.1, h + 2.2, 0]], 0.12, [0.02, 0.02]));
    }
  }
  g.position.set(x, 0, z);
  scene.add(g);
}
seed = 11;
let xl = -70;
for (const w of [16, 12, 18, 14, 20, 13, 17, 15]) {
  house({ x: xl + w / 2, z: -16, w, floors: 2 + Math.floor(rnd() * 3), roof: rnd() > 0.55 ? 'gable' : 'flat', side: 1 });
  xl += w + 1.2;
}
let xr = -66;
for (const w of [14, 19, 12, 16, 18, 13, 20]) {
  house({ x: xr + w / 2, z: 16, w, floors: 2 + Math.floor(rnd() * 4), roof: rnd() > 0.55 ? 'gable' : 'flat', side: -1 });
  xr += w + 1.2;
}

/* ---------- street props ---------- */
function lamp(x, z) {
  scene.add(inkTube([[x, 0, z], [x, 5.5, z], [x + 0.1, 10, z], [x + 1.4, 11, z]], 0.16, [0.02, 0.05]));
  const glob = solid(new THREE.SphereGeometry(0.55, 16, 12), x + 1.6, 10.4, z, paperMat);
  glob.add(solid(new THREE.SphereGeometry(0.55 * 1.25, 16, 12), 0, 0, 0, new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide })));
  scene.add(glob);
}
function tree(x, z) {
  scene.add(inkTube([[x, 0, z], [x + 0.2, 4, z], [x - 0.1, 8, z + 0.2], [x, 11, z]], 0.38, [0.02, 0.45]));
  for (let i = 0; i < 6; i++) {
    const a = rnd() * Math.PI * 2, y = 5 + rnd() * 4, L = 2 + rnd() * 2.5;
    scene.add(inkTube([[x, y, z], [x + Math.cos(a) * L * 0.5, y + L * 0.45, z + Math.sin(a) * L * 0.5], [x + Math.cos(a) * L, y + L * 0.9, z + Math.sin(a) * L]], 0.14, [0.05, 0.6]));
  }
}
function bench(x, z, rotY) {
  const g = new THREE.Group();
  g.add(inkBox(3.2, 0.18, 0.9, 0, 1.3, 0), inkBox(3.2, 0.9, 0.15, 0, 2.0, -0.45));
  for (const s of [-1.3, 1.3]) g.add(solid(new THREE.BoxGeometry(0.15, 1.3, 0.8), s, 0.65, 0));
  g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
}
seed = 21;
for (let x = -64; x < 70; x += 16) { lamp(x, -7.3); lamp(x + 8, 7.3); }
for (let x = -58; x < 70; x += 24) { tree(x, -9.5); tree(x + 12, 9.5); }
bench(-20, -9.6, 0); bench(14, 9.6, Math.PI); bench(34, -9.6, 0);
// mailbox + hydrant
scene.add(inkBox(1, 2.2, 1, 6, 1.1, -8.4));
scene.add(solid(new THREE.CylinderGeometry(0.35, 0.4, 1.4, 10), -8, 0.7, 8.3));

/* car: paper body with ink edges, black wheels */
const car = new THREE.Group();
{
  const body = new RoundedBoxGeometry(8, 2, 3.4, 2, 0.4);
  const cab = new RoundedBoxGeometry(4.4, 1.8, 3.1, 2, 0.4);
  const b = new THREE.Mesh(body, paperMat); b.position.y = 1.9; b.add(inkEdges(body, EDGE, 0.01, 40));
  const c = new THREE.Mesh(cab, paperMat); c.position.set(-0.4, 3.6, 0); c.add(inkEdges(cab, EDGE, 0.01, 40));
  for (const s of [-1, 1]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.2), inkMat); w.position.set(-0.4 + s * 1.05, 3.6, 1.56); c.parent; car.add(w); }
  car.add(b, c);
  car.wheels = [];
  for (const wx of [-2.6, 2.6]) for (const wz of [-1.5, 1.5]) {
    const wh = solid(new THREE.CylinderGeometry(0.95, 0.95, 0.6, 14), wx, 0.95, wz);
    wh.rotation.x = Math.PI / 2; car.add(wh); car.wheels.push(wh);
    const hub = solid(new THREE.CylinderGeometry(0.35, 0.35, 0.65, 10), 0, 0, 0, paperMat); wh.add(hub);
  }
}
scene.add(car);

/* birds */
const birds = [];
for (let i = 0; i < 6; i++) {
  const g = new THREE.Group();
  g.add(inkTube([[-0.8, 0.3, 0], [-0.3, 0.2, 0], [0, 0, 0]], 0.06, [0.4, 0.05]));
  g.add(inkTube([[0, 0, 0], [0.3, 0.25, 0], [0.8, 0.35, 0]], 0.06, [0.05, 0.4]));
  g.userData = { r: 30 + rnd() * 25, h: 26 + rnd() * 10, s: 0.08 + rnd() * 0.05, p: rnd() * 6 };
  scene.add(g); birds.push(g);
}

/* ---------- stickmen (3D, rebuilt each frame on a Bezier rig) ---------- */
const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
const ringMat = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });
const ARM = 1.2, LEG = 1.5, TORSO = 1.35, HEAD = 0.48, LR = 0.085;

function limbGeo(a, b, len, bend) {
  const A = new THREE.Vector3(...a); let B = new THREE.Vector3(...b);
  const ab = B.clone().sub(A); let dist = ab.length();
  if (dist > len) { B = A.clone().add(ab.multiplyScalar(len / dist)); dist = len; }
  const axis = B.clone().sub(A).normalize();
  const sd = new THREE.Vector3(...bend); sd.sub(axis.clone().multiplyScalar(sd.dot(axis)));
  if (sd.lengthSq() < 1e-6) sd.set(0, 0, 1);
  sd.normalize();
  const hgt = Math.sqrt(Math.max(0, (len / 2) ** 2 - (dist / 2) ** 2));
  const mid = A.clone().add(B).multiplyScalar(0.5);
  const ctrl = mid.clone().add(sd.multiplyScalar(hgt)).multiplyScalar(2).sub(mid);
  return { geo: new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(A, ctrl, B), 14, LR, 8, false), end: B };
}

class Stickman {
  constructor() {
    this.root = new THREE.Group();
    this.limbs = [];
    for (let i = 0; i < 5; i++) {
      const m = new THREE.Mesh(new THREE.BufferGeometry(), inkMat);
      const capA = solid(new THREE.SphereGeometry(LR, 8, 6), 0, 0, 0), capB = solid(new THREE.SphereGeometry(LR, 8, 6), 0, 0, 0);
      this.root.add(m, capA, capB);
      this.limbs.push({ m, capA, capB });
    }
    this.head = new THREE.Mesh(new THREE.SphereGeometry(HEAD, 32, 24), headMat);
    this.head.add(new THREE.Mesh(new THREE.SphereGeometry(HEAD * 1.24, 32, 24), ringMat));
    this.root.add(this.head);
    this.alarm = new THREE.Group();
    [-0.5, 0, 0.5].forEach((x, i) => this.alarm.add(inkTube([[x * 0.5, 0, 0], [x * 0.9, 0.6 + (i === 1 ? 0.25 : 0), 0]], 0.09, [0.02, 0.05])));
    this.root.add(this.alarm);
    scene.add(this.root);
  }
  /** pose in local space; character faces +x */
  set(p) {
    const hips = p.hips ?? [0, 1.5, 0];
    const lean = p.lean ?? 0;
    const top = [hips[0] + Math.sin(lean) * TORSO, hips[1] + Math.cos(lean) * TORSO, hips[2]];
    const sh = [hips[0] + (top[0] - hips[0]) * 0.82, hips[1] + (top[1] - hips[1]) * 0.82, hips[2]];
    const parts = [
      [hips, top, TORSO, [1, 0, 0]],
      [sh, p.handL ?? [sh[0] - 0.25, sh[1] - 1.1, -0.15], ARM, p.elbowL ?? [-0.3, -1, 0]],
      [sh, p.handR ?? [sh[0] + 0.25, sh[1] - 1.1, 0.15], ARM, p.elbowR ?? [-0.3, -1, 0]],
      [hips, p.footL ?? [hips[0] - 0.35, 0.06, -0.15], LEG, [1, 0, 0]],
      [hips, p.footR ?? [hips[0] + 0.35, 0.06, 0.15], LEG, [1, 0, 0]],
    ];
    parts.forEach(([a, b, len, bend], i) => {
      const { geo, end } = limbGeo(a, b, len, bend);
      const L = this.limbs[i];
      L.m.geometry.dispose(); L.m.geometry = geo;
      L.capA.position.set(...a); L.capB.position.copy(end);
    });
    this.head.position.set(top[0] + Math.sin(lean) * HEAD * 1.15, top[1] + Math.cos(lean) * HEAD * 1.15, top[2]);
    this.alarm.visible = (p.alarm ?? 0) > 0.01;
    this.alarm.position.set(this.head.position.x, this.head.position.y + HEAD + 0.5, 0);
    this.alarm.scale.setScalar(Math.max(0.01, p.alarm ?? 0));
    this.alarm.quaternion.copy(camera.quaternion).premultiply(this.root.quaternion.clone().invert());
  }
}
const walkPose = (ph, run = 0) => {
  const s = Math.sin(ph), k = 1 + run * 0.6;
  return {
    hips: [0, 1.45 + Math.abs(Math.cos(ph)) * 0.08, 0],
    lean: 0.08 + run * 0.25,
    footL: [0.45 * s * k, 0.06 + Math.max(0, Math.cos(ph)) * 0.35 * k, -0.15],
    footR: [-0.45 * s * k, 0.06 + Math.max(0, -Math.cos(ph)) * 0.35 * k, 0.15],
    handL: [-0.45 * s * k, 1.85 + run * 0.4, -0.25],
    handR: [0.45 * s * k, 1.85 + run * 0.4, 0.25],
  };
};

// cast: walkers on both sidewalks, a jogger, a waver, a sitter, someone startled by the car
const people = [];
const add = (opts) => { const s = new Stickman(); s.o = opts; people.push(s); return s; };
add({ kind: 'walk', z: -9, x0: -50, speed: 2.2, dir: 1 });
add({ kind: 'walk', z: -8.2, x0: 20, speed: 2.0, dir: 1, phase: 1.3 });
add({ kind: 'walk', z: 8.6, x0: 40, speed: 2.4, dir: -1 });
add({ kind: 'run', z: 9.4, x0: -10, speed: 5.2, dir: -1 });
add({ kind: 'wave', x: -24, z: -8.4, rot: -Math.PI / 2 });
add({ kind: 'sit', x: 14, z: 9.2, rot: -Math.PI / 2 });
add({ kind: 'startle', x: 4, z: -7.9, rot: -Math.PI / 2 });

/* ---------- animation loop ---------- */
let playing = true, t = 0, last = performance.now(), autoRot = false;
const wrap = (x) => ((x + 75) % 150 + 150) % 150 - 75;
function update(dt) {
  t += dt;
  const carX = wrap(-75 + t * 14);
  car.position.set(carX, 0, -2.8);
  car.wheels.forEach((w) => (w.rotation.y -= dt * 14 / 0.95));
  for (const p of people) {
    const o = p.o;
    if (o.kind === 'walk' || o.kind === 'run') {
      const x = wrap(o.x0 + o.dir * t * o.speed);
      p.root.position.set(x, 0, o.z);
      p.root.rotation.y = o.dir > 0 ? 0 : Math.PI;
      p.set(walkPose(t * o.speed * (o.kind === 'run' ? 1.6 : 2.2) + (o.phase ?? 0), o.kind === 'run' ? 1 : 0));
    } else {
      p.root.position.set(o.x, 0, o.z);
      p.root.rotation.y = o.rot;
      if (o.kind === 'wave') p.set({ handR: [0.3, 3.4 + 0.25 * Math.sin(t * 8), 0.9 + 0.4 * Math.sin(t * 8)], elbowR: [0, -1, 1] });
      if (o.kind === 'sit') p.set({ hips: [0, 1.35, -0.2], lean: -0.05, footL: [0.9, 0.06, -0.2], footR: [1.0, 0.06, 0.2], handL: [0.6, 1.8, -0.25], handR: [0.65, 1.85, 0.25] });
      if (o.kind === 'startle') {
        const near = Math.max(0, 1 - Math.abs(carX - o.x) / 9);
        p.set({ lean: -0.15 * near, handL: [0.4 + near * 0.7, 1.9 + near * 0.6, -0.3], handR: [0.4 + near * 0.6, 1.8 + near * 0.4, 0.3], alarm: near > 0.2 ? Math.min(1, near * 1.5) : 0 });
      }
    }
  }
  for (const b of birds) {
    const u = b.userData, a = t * u.s + u.p;
    b.position.set(Math.cos(a) * u.r, u.h + Math.sin(t * 2 + u.p), Math.sin(a) * u.r * 0.5);
    b.rotation.y = -a;
    b.children[0].rotation.z = Math.sin(t * 9 + u.p) * 0.4;
    b.children[1].rotation.z = -Math.sin(t * 9 + u.p) * 0.4;
  }
}

/* ---------- camera views ---------- */
const VIEWS = {
  street: { pos: [-34, 6.5, 3.5], target: [0, 6, -2] },
  top: { pos: [0, 70, 55], target: [0, 0, 0] },
  close: { pos: [9, 3.8, -1], target: [4, 2.3, -7.9] },
};
function view(name) {
  const v = VIEWS[name];
  camera.position.set(...v.pos);
  controls.target.set(...v.target);
  controls.update();
}
view('street');
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => view(b.dataset.view)));
const animBtn = document.getElementById('anim');
animBtn.onclick = () => { playing = !playing; animBtn.textContent = playing ? '⏸ Пауза' : '▶ Играть'; animBtn.classList.toggle('on', playing); };
const autoBtn = document.getElementById('auto');
autoBtn.onclick = () => { autoRot = !autoRot; controls.autoRotate = autoRot; controls.autoRotateSpeed = 0.6; autoBtn.classList.toggle('on', autoRot); };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  lineMats.forEach((m) => m.resolution.set(innerWidth, innerHeight));
});

update(0.001);
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (playing) update(dt);
  controls.update();
  renderer.render(scene, camera);
});
window.__ready = true;
</script>
<script>setTimeout(() => { if (!window.__ready) document.getElementById('err').style.display = 'grid'; }, 8000);</script>
